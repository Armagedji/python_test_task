[project]
name = "python-test-task"
version = "0.1.0"
description = "Test task on Python"
readme = "README.md"
authors = [
    { name = "Armagedji", email = "armagedji@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "elasticsearch[async]>=9.5.1",
    "fastapi>=0.143.2",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
python-test-task = "python_test_task:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
